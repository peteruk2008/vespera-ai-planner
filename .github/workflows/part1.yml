name: Setup Vespera Part 1
on:
  push:
    paths:
      - '.github/workflows/part1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Vespera Part 1
        shell: bash
        run: |
          mkdir -p prisma src/lib src/app/api/auth/{register,login,logout,me} src/app/api/ai/{plan,refine} src/app/api/tasks/reorder "src/app/api/tasks/[id]" src/app/api/dashboard/stats src/app/api/analytics/track src/app/api/public/site src/app/api/admin/{settings,sections,pages,projects,upload,analytics}

          cat <<'VESPERA_EOF' > package.json
          {
            "name": "vespera-ai-planner",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "dev": "next dev --turbopack",
              "build": "prisma generate && next build",
              "start": "next start",
              "db:push": "prisma db push",
              "db:seed": "tsx prisma/seed.ts"
            },
            "dependencies": {
              "@prisma/client": "^6.19.0",
              "bcryptjs": "^3.0.2",
              "framer-motion": "^12.4.0",
              "gsap": "^3.12.7",
              "jose": "^6.0.10",
              "lucide-react": "^0.475.0",
              "next": "^16.0.0",
              "openai": "^4.85.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "three": "^0.173.0",
              "zod": "^3.24.2"
            },
            "devDependencies": {
              "@tailwindcss/postcss": "^4.0.0",
              "@types/bcryptjs": "^2.4.6",
              "@types/node": "^22.13.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@types/three": "^0.173.0",
              "dotenv": "^16.4.7",
              "prisma": "^6.19.0",
              "tailwindcss": "^4.0.0",
              "tsx": "^4.19.2",
              "typescript": "^5.7.3"
            }
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > next.config.ts
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = { images: { unoptimized: true } };
          export default nextConfig;
          VESPERA_EOF

          cat <<'VESPERA_EOF' > tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2017",
              "lib": ["dom", "dom.iterable", "esnext"],
              "allowJs": true,
              "skipLibCheck": true,
              "strict": true,
              "noEmit": true,
              "esModuleInterop": true,
              "module": "esnext",
              "moduleResolution": "bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "jsx": "preserve",
              "incremental": true,
              "plugins": [{ "name": "next" }],
              "paths": { "@/*": ["./src/*"] }
            },
            "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"],
            "exclude": ["node_modules"]
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > postcss.config.mjs
          const config = { plugins: { "@tailwindcss/postcss": {} } };
          export default config;
          VESPERA_EOF

          cat <<'VESPERA_EOF' > .gitignore
          /node_modules
          /.next/
          /out/
          .env
          .env*.local
          /public/uploads/*
          !.gitkeep
          VESPERA_EOF

          cat <<'VESPERA_EOF' > .env.example
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/vespera?schema=public"
          AUTH_SECRET="replace-with-a-long-cryptographically-random-secret-key-min-32-chars"
          OPENAI_API_KEY="sk-your-openai-api-key"
          OPENAI_MODEL="gpt-4o-mini"
          ADMIN_EMAIL="owner@vespera.ai"
          ADMIN_PASSWORD="ChangeMeImmediately!2026"
          ADMIN_NAME="Vespera Owner"
          VESPERA_EOF

          cat <<'VESPERA_EOF' > prisma/schema.prisma
          generator client {
            provider = "prisma-client-js"
          }

          datasource db {
            provider = "postgresql"
            url      = env("DATABASE_URL")
          }

          enum Role {
            USER
            ADMIN
          }

          enum Priority {
            LOW
            MEDIUM
            HIGH
            CRITICAL
          }

          enum TaskStatus {
            PENDING
            IN_PROGRESS
            COMPLETED
            SKIPPED
          }

          enum TaskCategory {
            WORK
            STUDY
            HEALTH
            PERSONAL
            BREAK
            FREE_TIME
          }

          model User {
            id           String        @id @default(cuid())
            email        String        @unique
            name         String
            passwordHash String
            role         Role          @default(USER)
            timezone     String        @default("UTC")
            createdAt    DateTime      @default(now())
            updatedAt    DateTime      @updatedAt
            tasks        Task[]
            chatMessages ChatMessage[]
          }

          model Task {
            id              String       @id @default(cuid())
            userId          String
            user            User         @relation(fields: [userId], references: [id], onDelete: Cascade)
            title           String
            description     String       @default("")
            date            String
            startTime       String
            endTime         String
            durationMinutes Int
            priority        Priority     @default(MEDIUM)
            category        TaskCategory @default(WORK)
            status          TaskStatus   @default(PENDING)
            isBreak         Boolean      @default(false)
            sortOrder       Int          @default(0)
            aiGenerated     Boolean      @default(false)
            createdAt       DateTime     @default(now())
            updatedAt       DateTime     @updatedAt

            @@index([userId, date])
          }

          model ChatMessage {
            id        String   @id @default(cuid())
            userId    String
            user      User     @relation(fields: [userId], references: [id], onDelete: Cascade)
            date      String
            role      String
            content   String
            createdAt DateTime @default(now())

            @@index([userId, date])
          }

          model SiteSettings {
            id              String   @id @default("singleton")
            siteName        String   @default("Vespera")
            tagline         String   @default("Autonomous Intelligence for Your Daily Architecture")
            heroTitle       String   @default("Design Your Day With Liquid Precision")
            heroSubtitle    String   @default("Describe your goals in plain language. Vespera orchestrates deep work, recovery breaks, and personal priorities into a balanced living schedule.")
            heroCtaText     String   @default("Launch AI Planner")
            accentColor     String   @default("#38bdf8")
            secondaryColor  String   @default("#a855f7")
            footerText      String   @default("© 2026 Vespera Intelligence Labs. Crafted for peak human rhythm.")
            maintenanceMode Boolean  @default(false)
            updatedAt       DateTime @updatedAt
          }

          model SiteSection {
            id        String   @id @default(cuid())
            key       String   @unique
            title     String
            subtitle  String   @default("")
            content   String
            imageUrl  String?
            badge     String?
            sortOrder Int      @default(0)
            published Boolean  @default(true)
            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt
          }

          model CustomPage {
            id        String   @id @default(cuid())
            slug      String   @unique
            title     String
            summary   String   @default("")
            content   String
            heroImage String?
            published Boolean  @default(true)
            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt
          }

          model ProjectShowcase {
            id          String   @id @default(cuid())
            title       String
            category    String
            description String
            imageUrl    String?
            linkUrl     String?
            featured    Boolean  @default(true)
            sortOrder   Int      @default(0)
            createdAt   DateTime @default(now())
            updatedAt   DateTime @updatedAt
          }

          model MediaAsset {
            id           String   @id @default(cuid())
            filename     String
            originalName String
            url          String   @unique
            mimeType     String
            sizeBytes    Int
            createdAt    DateTime @default(now())
          }

          model VisitorEvent {
            id        String   @id @default(cuid())
            path      String
            visitorId String
            referrer  String?
            userAgent String?
            createdAt DateTime @default(now())

            @@index([createdAt])
            @@index([path])
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > prisma/seed.ts
          import "dotenv/config";
          import { PrismaClient, Role } from "@prisma/client";
          import bcrypt from "bcryptjs";

          const prisma = new PrismaClient();

          async function main() {
            const adminEmail = process.env.ADMIN_EMAIL || "owner@vespera.ai";
            const adminPassword = process.env.ADMIN_PASSWORD || "ChangeMeImmediately!2026";
            const adminName = process.env.ADMIN_NAME || "Vespera Owner";
            const passwordHash = await bcrypt.hash(adminPassword, 12);

            await prisma.user.upsert({
              where: { email: adminEmail.toLowerCase() },
              update: { role: Role.ADMIN, name: adminName },
              create: { email: adminEmail.toLowerCase(), name: adminName, passwordHash, role: Role.ADMIN },
            });

            await prisma.siteSettings.upsert({ where: { id: "singleton" }, update: {}, create: { id: "singleton" } });

            const sections = [
              { key: "neural-scheduling", badge: "COGNITIVE ENGINE", title: "Natural Language to Structured Time", subtitle: "Zero rigid forms. Just tell Vespera what your day demands.", content: "Describe your studying, gym, calls, and rest in plain language. Vespera estimates realistic durations, inserts recovery breaks, and prioritizes critical outcomes automatically.", sortOrder: 1 },
              { key: "adaptive-chat", badge: "LIVE REFINEMENT", title: "Conversational Schedule Sculpting", subtitle: "Plans change. Vespera adapts in real time.", content: "Running late or low on energy? Ask the embedded Vespera Assistant to move your workout, split a study block, or protect your evening free time.", sortOrder: 2 },
              { key: "rhythm-analytics", badge: "TELEMETRY", title: "Flow-State Analytics & Weekly Cadence", subtitle: "Measure completion momentum without burnout.", content: "Track daily progress percentages, deep-work versus recovery balance, weekly consistency, and multi-day timelines in one tranquil Liquid Glass workspace.", sortOrder: 3 },
            ];
            for (const s of sections) await prisma.siteSection.upsert({ where: { key: s.key }, update: {}, create: s });

            if ((await prisma.projectShowcase.count()) === 0) {
              await prisma.projectShowcase.createMany({
                data: [
                  { title: "Vespera Core v2.4", category: "AI Scheduling Kernel", description: "Constraint-solving LLM orchestration balancing deep focus with ultradian rest cycles.", featured: true, sortOrder: 1 },
                  { title: "Circadian Flow Matrix", category: "Productivity Telemetry", description: "Real-time completion tracking, weekly momentum charts, and interactive calendar views.", featured: true, sortOrder: 2 },
                  { title: "Liquid Glass Interface", category: "Spatial UI System", description: "Refractive glassmorphism panels, WebGL orbital shaders, and GSAP choreography.", featured: true, sortOrder: 3 },
                ],
              });
            }

            await prisma.customPage.upsert({
              where: { slug: "methodology" },
              update: {},
              create: {
                slug: "methodology",
                title: "The Vespera Method",
                summary: "How Vespera blends ultradian biology with artificial intelligence.",
                content: "Human focus peaks in 90-minute ultradian waves followed by 15-20 minute neural recovery windows.\n\nVespera weighs priority levels, clusters deep-focus blocks during peak hours, anchors physical exercise to reset dopamine, and guarantees breathing room before sleep.",
                published: true,
              },
            });
            console.log(`Seed complete. Admin: ${adminEmail}`);
          }

          main().catch((e) => { console.error(e); process.exit(1); }).finally(() => prisma.$disconnect());
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/lib/prisma.ts
          import { PrismaClient } from "@prisma/client";
          const globalForPrisma = globalThis as unknown as { prisma: PrismaClient | undefined };
          export const prisma = globalForPrisma.prisma ?? new PrismaClient({ log: process.env.NODE_ENV === "development" ? ["error", "warn"] : ["error"] });
          if (process.env.NODE_ENV !== "production") globalForPrisma.prisma = prisma;
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/lib/jwt.ts
          import { SignJWT, jwtVerify } from "jose";

          export const SESSION_COOKIE = "vespera_session";
          export interface SessionPayload { userId: string; email: string; name: string; role: "USER" | "ADMIN"; }

          function getSecretKey(): Uint8Array {
            const secret = process.env.AUTH_SECRET;
            if (!secret || secret.length < 16) throw new Error("AUTH_SECRET must be set (min 16 characters).");
            return new TextEncoder().encode(secret);
          }

          export async function signSessionToken(payload: SessionPayload): Promise<string> {
            return new SignJWT({ ...payload }).setProtectedHeader({ alg: "HS256" }).setIssuedAt().setExpirationTime("7d").sign(getSecretKey());
          }

          export async function verifySessionToken(token: string): Promise<SessionPayload | null> {
            try {
              const { payload } = await jwtVerify(token, getSecretKey());
              if (typeof payload.userId !== "string" || typeof payload.email !== "string" || typeof payload.name !== "string" || (payload.role !== "USER" && payload.role !== "ADMIN")) return null;
              return { userId: payload.userId, email: payload.email, name: payload.name, role: payload.role };
            } catch { return null; }
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/lib/auth.ts
          import { cookies } from "next/headers";
          import { prisma } from "./prisma";
          import { SESSION_COOKIE, signSessionToken, verifySessionToken, type SessionPayload } from "./jwt";
          export { SESSION_COOKIE, signSessionToken, verifySessionToken, type SessionPayload };

          export async function getSessionUser(): Promise<SessionPayload | null> {
            const token = (await cookies()).get(SESSION_COOKIE)?.value;
            if (!token) return null;
            const parsed = await verifySessionToken(token);
            if (!parsed) return null;
            const dbUser = await prisma.user.findUnique({ where: { id: parsed.userId }, select: { id: true, email: true, name: true, role: true } });
            if (!dbUser) return null;
            return { userId: dbUser.id, email: dbUser.email, name: dbUser.name, role: dbUser.role };
          }

          export async function requireUser() {
            const user = await getSessionUser();
            if (!user) throw new Error("UNAUTHORIZED");
            return user;
          }

          export async function requireAdmin() {
            const user = await requireUser();
            if (user.role !== "ADMIN") throw new Error("FORBIDDEN");
            return user;
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/lib/ai.ts
          import OpenAI from "openai";
          import { z } from "zod";

          export const AiTaskSchema = z.object({
            title: z.string().min(1).max(120),
            description: z.string().max(400).default(""),
            startTime: z.string().regex(/^\d{2}:\d{2}$/),
            endTime: z.string().regex(/^\d{2}:\d{2}$/),
            durationMinutes: z.number().int().min(5).max(720),
            priority: z.enum(["LOW", "MEDIUM", "HIGH", "CRITICAL"]),
            category: z.enum(["WORK", "STUDY", "HEALTH", "PERSONAL", "BREAK", "FREE_TIME"]),
            isBreak: z.boolean(),
          });

          export const AiScheduleResponseSchema = z.object({ summary: z.string(), coachNote: z.string(), tasks: z.array(AiTaskSchema).min(1) });

          function getOpenAIClient() {
            const apiKey = process.env.OPENAI_API_KEY;
            if (!apiKey) throw new Error("AI_NOT_CONFIGURED");
            return new OpenAI({ apiKey, baseURL: process.env.OPENAI_BASE_URL || undefined });
          }

          export async function generateDailySchedule(params: {
            prompt: string; date: string; wakeTime?: string; sleepTime?: string;
            existingTasks?: Array<{ title: string; startTime: string; endTime: string; priority: string; status: string }>;
          }) {
            const client = getOpenAIClient();
            const systemPrompt = `You are Vespera, an elite cognitive productivity architect.
          Design a realistic, conflict-free daily schedule for ${params.date}.
          Return ONLY valid JSON: { "summary": "...", "coachNote": "...", "tasks": [{ "title": "...", "description": "...", "startTime": "HH:mm", "endTime": "HH:mm", "durationMinutes": 60, "priority": "LOW|MEDIUM|HIGH|CRITICAL", "category": "WORK|STUDY|HEALTH|PERSONAL|BREAK|FREE_TIME", "isBreak": false }] }
          Rules: Insert 10-20m breaks after deep focus, include meals/rest, no overlaps, chronological order, active window ${params.wakeTime || "08:00"}-${params.sleepTime || "22:30"}. Match user language (Arabic or English) while keeping enum values English.`;

            const completion = await client.chat.completions.create({
              model: process.env.OPENAI_MODEL || "gpt-4o-mini",
              temperature: 0.4,
              response_format: { type: "json_object" },
              messages: [{ role: "system", content: systemPrompt }, { role: "user", content: `Date: ${params.date}\nRequest: ${params.prompt}${params.existingTasks?.length ? `\nExisting: ${JSON.stringify(params.existingTasks)}` : ""}` }],
            });
            const raw = completion.choices[0]?.message?.content;
            if (!raw) throw new Error("Empty AI response");
            return AiScheduleResponseSchema.parse(JSON.parse(raw));
          }

          export async function refineDailySchedule(params: {
            instruction: string; date: string; currentTasks: Array<Record<string, unknown>>; history: Array<{ role: "user" | "assistant"; content: string }>;
          }) {
            const client = getOpenAIClient();
            const completion = await client.chat.completions.create({
              model: process.env.OPENAI_MODEL || "gpt-4o-mini",
              temperature: 0.3,
              response_format: { type: "json_object" },
              messages: [
                { role: "system", content: `You are Vespera Assistant editing a schedule for ${params.date}. Return ONLY valid JSON: { "reply": "Explanation in user language", "tasks": [...] }. Keep unmentioned tasks intact unless shifting prevents overlaps.` },
                ...params.history.slice(-6),
                { role: "user", content: `Current:\n${JSON.stringify(params.currentTasks)}\n\nEdit: ${params.instruction}` },
              ],
            });
            const raw = completion.choices[0]?.message?.content;
            if (!raw) throw new Error("Empty AI response");
            return z.object({ reply: z.string(), tasks: z.array(AiTaskSchema).min(1) }).parse(JSON.parse(raw));
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/middleware.ts
          import { NextResponse } from "next/server";
          import type { NextRequest } from "next/server";
          import { verifySessionToken, SESSION_COOKIE } from "./lib/jwt";

          export async function middleware(request: NextRequest) {
            const { pathname } = request.nextUrl;
            const token = request.cookies.get(SESSION_COOKIE)?.value;
            const session = token ? await verifySessionToken(token) : null;

            if (pathname.startsWith("/admin")) {
              if (!session) { const u = new URL("/login", request.url); u.searchParams.set("next", pathname); return NextResponse.redirect(u); }
              if (session.role !== "ADMIN") return NextResponse.redirect(new URL("/dashboard", request.url));
            }
            if ((pathname.startsWith("/planner") || pathname.startsWith("/dashboard")) && !session) {
              const u = new URL("/login", request.url); u.searchParams.set("next", pathname); return NextResponse.redirect(u);
            }
            return NextResponse.next();
          }
          export const config = { matcher: ["/admin/:path*", "/planner/:path*", "/dashboard/:path*"] };
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/app/api/auth/register/route.ts
          import { NextResponse } from "next/server";
          import bcrypt from "bcryptjs";
          import { z } from "zod";
          import { prisma } from "@/lib/prisma";
          import { signSessionToken, SESSION_COOKIE } from "@/lib/auth";
          const Schema = z.object({ name: z.string().min(2).max(60), email: z.string().email(), password: z.string().min(8).max(100) });
          export async function POST(req: Request) {
            try {
              const { name, email, password } = Schema.parse(await req.json());
              const normalized = email.toLowerCase().trim();
              if (await prisma.user.findUnique({ where: { email: normalized } })) return NextResponse.json({ error: "Email is already registered." }, { status: 409 });
              const passwordHash = await bcrypt.hash(password, 12);
              const user = await prisma.user.create({ data: { name: name.trim(), email: normalized, passwordHash, role: "USER" }, select: { id: true, email: true, name: true, role: true } });
              const token = await signSessionToken({ userId: user.id, email: user.email, name: user.name, role: user.role });
              const res = NextResponse.json({ user }, { status: 201 });
              res.cookies.set(SESSION_COOKIE, token, { httpOnly: true, sameSite: "lax", secure: process.env.NODE_ENV === "production", path: "/", maxAge: 604800 });
              return res;
            } catch (err) {
              if (err instanceof z.ZodError) return NextResponse.json({ error: err.errors[0]?.message || "Invalid input" }, { status: 400 });
              return NextResponse.json({ error: "Registration failed" }, { status: 500 });
            }
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/app/api/auth/login/route.ts
          import { NextResponse } from "next/server";
          import bcrypt from "bcryptjs";
          import { z } from "zod";
          import { prisma } from "@/lib/prisma";
          import { signSessionToken, SESSION_COOKIE } from "@/lib/auth";
          export async function POST(req: Request) {
            try {
              const { email, password } = z.object({ email: z.string().email(), password: z.string().min(1) }).parse(await req.json());
              const user = await prisma.user.findUnique({ where: { email: email.toLowerCase().trim() } });
              if (!user || !(await bcrypt.compare(password, user.passwordHash))) return NextResponse.json({ error: "Invalid email or password." }, { status: 401 });
              const payload = { userId: user.id, email: user.email, name: user.name, role: user.role };
              const token = await signSessionToken(payload);
              const res = NextResponse.json({ user: payload });
              res.cookies.set(SESSION_COOKIE, token, { httpOnly: true, sameSite: "lax", secure: process.env.NODE_ENV === "production", path: "/", maxAge: 604800 });
              return res;
            } catch { return NextResponse.json({ error: "Authentication failed" }, { status: 400 }); }
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/app/api/auth/logout/route.ts
          import { NextResponse } from "next/server";
          import { SESSION_COOKIE } from "@/lib/auth";
          export async function POST() {
            const res = NextResponse.json({ ok: true });
            res.cookies.set(SESSION_COOKIE, "", { httpOnly: true, path: "/", maxAge: 0 });
            return res;
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/app/api/auth/me/route.ts
          import { NextResponse } from "next/server";
          import { getSessionUser } from "@/lib/auth";
          export async function GET() {
            const user = await getSessionUser();
            return user ? NextResponse.json({ user }) : NextResponse.json({ user: null }, { status: 401 });
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/app/api/ai/plan/route.ts
          import { NextResponse } from "next/server";
          import { z } from "zod";
          import { prisma } from "@/lib/prisma";
          import { requireUser } from "@/lib/auth";
          import { generateDailySchedule } from "@/lib/ai";
          const Schema = z.object({ prompt: z.string().min(3).max(2000), date: z.string().regex(/^\d{4}-\d{2}-\d{2}$/), wakeTime: z.string().regex(/^\d{2}:\d{2}$/).optional(), sleepTime: z.string().regex(/^\d{2}:\d{2}$/).optional(), replaceExisting: z.boolean().default(true) });
          export async function POST(req: Request) {
            try {
              const user = await requireUser();
              const input = Schema.parse(await req.json());
              const existingTasks = input.replaceExisting ? [] : await prisma.task.findMany({ where: { userId: user.userId, date: input.date }, orderBy: { sortOrder: "asc" } });
              const aiPlan = await generateDailySchedule({ ...input, existingTasks });
              const savedTasks = await prisma.$transaction(async (tx) => {
                if (input.replaceExisting) await tx.task.deleteMany({ where: { userId: user.userId, date: input.date } });
                const created = [];
                for (let i = 0; i < aiPlan.tasks.length; i++) {
                  created.push(await tx.task.create({ data: { userId: user.userId, date: input.date, ...aiPlan.tasks[i], status: "PENDING", sortOrder: i, aiGenerated: true } }));
                }
                await tx.chatMessage.createMany({ data: [{ userId: user.userId, date: input.date, role: "user", content: input.prompt }, { userId: user.userId, date: input.date, role: "assistant", content: `${aiPlan.summary} — ${aiPlan.coachNote}` }] });
                return created;
              });
              return NextResponse.json({ summary: aiPlan.summary, coachNote: aiPlan.coachNote, tasks: savedTasks });
            } catch (err) {
              if (err instanceof Error && err.message === "UNAUTHORIZED") return NextResponse.json({ error: "Unauthorized" }, { status: 401 });
              if (err instanceof Error && err.message === "AI_NOT_CONFIGURED") return NextResponse.json({ error: "OPENAI_API_KEY is not configured in .env" }, { status: 503 });
              return NextResponse.json({ error: "Failed to generate schedule." }, { status: 500 });
            }
