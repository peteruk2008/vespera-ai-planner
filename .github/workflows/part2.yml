name: Setup Vespera Part 2
on:
  push:
    paths:
      - '.github/workflows/part2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Vespera Part 2
        shell: bash
        run: |
          mkdir -p src/components/{three,ui,landing,planner,dashboard,admin} src/app/{login,register,planner,dashboard,admin} "src/app/[slug]"

          cat <<'VESPERA_EOF' > src/app/globals.css
          @import "tailwindcss";

          :root {
            --bg-obsidian: #05070e;
          }

          html {
            scroll-behavior: smooth;
            background-color: var(--bg-obsidian);
            color: #f8fafc;
          }

          body {
            min-height: 100vh;
            background:
              radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.14), transparent 40%),
              radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.15), transparent 42%),
              radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.1), transparent 45%),
              #05070e;
            overflow-x: hidden;
          }

          .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(15, 23, 42, 0.55) 50%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2);
          }

          .liquid-glass-hover {
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s ease, box-shadow 0.35s ease;
          }

          .liquid-glass-hover:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 24px 60px rgba(56, 189, 248, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.32);
          }

          .glow-btn {
            background: linear-gradient(135deg, #38bdf8, #818cf8 50%, #a855f7);
            box-shadow: 0 0 28px rgba(56, 189, 248, 0.35);
            transition: all 0.3s ease;
          }

          .glow-btn:hover {
            box-shadow: 0 0 42px rgba(168, 85, 247, 0.55);
            transform: translateY(-1px);
          }

          .grid-backdrop {
            background-image:
              linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
              linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 48px 48px;
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/app/layout.tsx
          import type { Metadata } from "next";
          import { Plus_Jakarta_Sans, Space_Grotesk } from "next/font/google";
          import "./globals.css";
          import { Navbar } from "@/components/ui/Navbar";
          import { PageTracker } from "@/components/ui/PageTracker";
          import { getSessionUser } from "@/lib/auth";
          import { prisma } from "@/lib/prisma";

          const sans = Plus_Jakarta_Sans({ subsets: ["latin"], variable: "--font-sans" });
          const display = Space_Grotesk({ subsets: ["latin"], variable: "--font-display" });

          export async function generateMetadata(): Promise<Metadata> {
            const settings = await prisma.siteSettings.findUnique({ where: { id: "singleton" } }).catch(() => null);
            return {
              title: settings ? `${settings.siteName} — ${settings.tagline}` : "Vespera — AI Smart Daily Planner",
              description: settings?.heroSubtitle || "Intelligent Liquid Glass AI Daily Planning Platform",
            };
          }

          export default async function RootLayout({ children }: { children: React.ReactNode }) {
            const [user, settings, pages] = await Promise.all([
              getSessionUser().catch(() => null),
              prisma.siteSettings.findUnique({ where: { id: "singleton" } }).catch(() => null),
              prisma.customPage.findMany({ where: { published: true }, select: { slug: true, title: true }, take: 4 }).catch(() => []),
            ]);

            return (
              <html lang="en" className={`${sans.variable} ${display.variable}`}>
                <body className="font-sans antialiased selection:bg-sky-400/30 selection:text-white">
                  <div className="fixed inset-0 grid-backdrop pointer-events-none -z-10" />
                  <PageTracker />
                  <Navbar siteName={settings?.siteName || "Vespera"} user={user} customPages={pages} />
                  <main className="pt-20">{children}</main>
                </body>
              </html>
            );
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/components/three/LiquidOrbScene.tsx
          "use client";
          import { useEffect, useRef } from "react";
          import * as THREE from "three";

          export function LiquidOrbScene() {
            const mountRef = useRef<HTMLDivElement>(null);

            useEffect(() => {
              const container = mountRef.current;
              if (!container) return;

              const scene = new THREE.Scene();
              const camera = new THREE.PerspectiveCamera(45, container.clientWidth / (container.clientHeight || 380), 0.1, 100);
              camera.position.z = 5.2;

              const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
              renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
              renderer.setSize(container.clientWidth, container.clientHeight || 380);
              container.appendChild(renderer.domElement);

              const geometry = new THREE.IcosahedronGeometry(1.55, 5);
              const positionAttr = geometry.getAttribute("position") as THREE.BufferAttribute;
              const basePositions = new Float32Array(positionAttr.array as Float32Array);

              const material = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color("#0f172a"),
                emissive: new THREE.Color("#1d4ed8"),
                emissiveIntensity: 0.35,
                roughness: 0.12,
                metalness: 0.2,
                transmission: 0.6,
                thickness: 1.2,
              });
              const orb = new THREE.Mesh(geometry, material);
              scene.add(orb);

              const wireGeo = new THREE.IcosahedronGeometry(1.75, 2);
              const wireMat = new THREE.MeshBasicMaterial({ color: "#38bdf8", wireframe: true, transparent: true, opacity: 0.22 });
              const cage = new THREE.Mesh(wireGeo, wireMat);
              scene.add(cage);

              const pGeo = new THREE.BufferGeometry();
              const pPos = new Float32Array(180 * 3);
              for (let i = 0; i < pPos.length; i++) pPos[i] = (Math.random() - 0.5) * 9;
              pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
              const pMat = new THREE.PointsMaterial({ color: "#a855f7", size: 0.035, transparent: true, opacity: 0.7 });
              const particles = new THREE.Points(pGeo, pMat);
              scene.add(particles);

              const l1 = new THREE.PointLight("#38bdf8", 18, 20); l1.position.set(3, 3, 4);
              const l2 = new THREE.PointLight("#a855f7", 18, 20); l2.position.set(-3, -2, 3);
              scene.add(l1, l2, new THREE.AmbientLight("#ffffff", 0.5));

              let mx = 0, my = 0;
              const onMove = (e: PointerEvent) => {
                mx = (e.clientX / window.innerWidth - 0.5) * 0.6;
                my = (e.clientY / window.innerHeight - 0.5) * 0.6;
              };
              const onResize = () => {
                if (!container) return;
                const h = container.clientHeight || 380;
                camera.aspect = container.clientWidth / h;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, h);
              };
              window.addEventListener("pointermove", onMove);
              window.addEventListener("resize", onResize);

              const clock = new THREE.Clock();
              let fid = 0;
              const animate = () => {
                fid = requestAnimationFrame(animate);
                const t = clock.getElapsedTime();
                for (let i = 0; i < positionAttr.count; i++) {
                  const ix = i * 3;
                  const bx = basePositions[ix], by = basePositions[ix + 1], bz = basePositions[ix + 2];
                  const wave = 1 + 0.085 * Math.sin(bx * 2.2 + t * 1.4) * Math.cos(by * 2.2 + t * 1.2);
                  positionAttr.setXYZ(i, bx * wave, by * wave, bz * wave);
                }
                positionAttr.needsUpdate = true;
                geometry.computeVertexNormals();
                orb.rotation.y += 0.004;
                orb.rotation.x += (my * 0.4 - orb.rotation.x) * 0.04;
                orb.rotation.z += (mx * 0.4 - orb.rotation.z) * 0.04;
                cage.rotation.y -= 0.0025;
                particles.rotation.y = t * 0.04;
                renderer.render(scene, camera);
              };
              animate();

              return () => {
                cancelAnimationFrame(fid);
                window.removeEventListener("pointermove", onMove);
                window.removeEventListener("resize", onResize);
                geometry.dispose(); material.dispose(); wireGeo.dispose(); wireMat.dispose(); pGeo.dispose(); pMat.dispose(); renderer.dispose();
                if (renderer.domElement.parentNode === container) container.removeChild(renderer.domElement);
              };
            }, []);

            return <div ref={mountRef} className="w-full h-full min-h-[340px]" />;
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/components/ui/GlassCard.tsx
          "use client";
          import { motion } from "framer-motion";
          import type { ReactNode } from "react";

          export function GlassCard({ children, className = "", hover = true }: { children: ReactNode; className?: string; hover?: boolean }) {
            return (
              <motion.div
                initial={{ opacity: 0, y: 16 }}
                whileInView={{ opacity: 1, y: 0 }}
                viewport={{ once: true, margin: "-40px" }}
                transition={{ duration: 0.45, ease: [0.22, 1, 0.36, 1] }}
                className={`liquid-glass rounded-3xl ${hover ? "liquid-glass-hover" : ""} ${className}`}
              >
                {children}
              </motion.div>
            );
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/components/ui/TypingText.tsx
          "use client";
          import { useEffect, useState } from "react";

          export function TypingText({ phrases, className = "" }: { phrases: string[]; className?: string }) {
            const [index, setIndex] = useState(0);
            const [sub, setSub] = useState(0);
            const [deleting, setDeleting] = useState(false);

            useEffect(() => {
              const current = phrases[index] || "";
              const timer = setTimeout(() => {
                if (!deleting) {
                  if (sub < current.length) setSub((s) => s + 1);
                  else setTimeout(() => setDeleting(true), 1500);
                } else {
                  if (sub > 0) setSub((s) => s - 1);
                  else { setDeleting(false); setIndex((i) => (i + 1) % phrases.length); }
                }
              }, deleting ? 28 : 50);
              return () => clearTimeout(timer);
            }, [sub, deleting, index, phrases]);

            return (
              <span className={className}>
                {phrases[index]?.slice(0, sub)}
                <span className="inline-block w-[2px] h-[1em] align-middle bg-sky-400 ml-1 animate-pulse" />
              </span>
            );
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/components/ui/NeuralLoader.tsx
          "use client";
          import { motion } from "framer-motion";

          export function NeuralLoader({ label = "Vespera Neural Engine is structuring your day..." }: { label?: string }) {
            return (
              <div className="liquid-glass rounded-3xl p-8 flex flex-col items-center justify-center text-center gap-5 border-sky-400/30">
                <div className="relative w-20 h-20 flex items-center justify-center">
                  <motion.div animate={{ rotate: 360 }} transition={{ duration: 3, repeat: Infinity, ease: "linear" }} className="absolute inset-0 rounded-full border-2 border-transparent border-t-sky-400 border-r-purple-400" />
                  <motion.div animate={{ rotate: -360 }} transition={{ duration: 2, repeat: Infinity, ease: "linear" }} className="absolute inset-2 rounded-full border-2 border-transparent border-b-cyan-300 border-l-indigo-400" />
                  <motion.div animate={{ scale: [0.85, 1.15, 0.85] }} transition={{ duration: 1.6, repeat: Infinity }} className="w-5 h-5 rounded-full bg-gradient-to-tr from-sky-400 to-purple-500 shadow-[0_0_24px_#38bdf8]" />
                </div>
                <div className="space-y-1">
                  <p className="text-sm font-medium text-sky-200">{label}</p>
                  <p className="text-xs text-slate-400">Balancing priorities, durations, and cognitive rest windows</p>
                </div>
              </div>
            );
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/components/ui/PageTracker.tsx
          "use client";
          import { useEffect } from "react";
          import { usePathname } from "next/navigation";

          export function PageTracker() {
            const pathname = usePathname();
            useEffect(() => {
              if (!pathname || pathname.startsWith("/admin")) return;
              let vid = localStorage.getItem("vespera_vid");
              if (!vid) { vid = crypto.randomUUID(); localStorage.setItem("vespera_vid", vid); }
              fetch("/api/analytics/track", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: pathname, visitorId: vid }) }).catch(() => {});
            }, [pathname]);
            return null;
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/components/ui/Navbar.tsx
          "use client";
          import Link from "next/link";
          import { usePathname, useRouter } from "next/navigation";
          import { useState } from "react";
          import { Sparkles, LayoutDashboard, CalendarClock, ShieldCheck, LogOut, Menu, X } from "lucide-react";
          import type { SessionPayload } from "@/lib/jwt";

          export function Navbar({ siteName, user, customPages }: { siteName: string; user: SessionPayload | null; customPages: Array<{ slug: string; title: string }> }) {
            const pathname = usePathname();
            const router = useRouter();
            const [open, setOpen] = useState(false);

            async function handleLogout() {
              await fetch("/api/auth/logout", { method: "POST" });
              router.push("/");
              router.refresh();
            }

            const navLink = (href: string, label: string, Icon?: React.ComponentType<{ className?: string }>) => (
              <Link key={href} href={href} onClick={() => setOpen(false)} className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm transition ${pathname === href ? "bg-white/15 text-white border border-white/20" : "text-slate-300 hover:text-white hover:bg-white/5"}`}>
                {Icon && <Icon className="w-4 h-4 text-sky-400" />}
                <span>{label}</span>
              </Link>
            );

            return (
              <header className="fixed top-0 inset-x-0 z-50 px-4 pt-3">
                <nav className="max-w-7xl mx-auto liquid-glass rounded-2xl px-4 py-2.5 flex items-center justify-between">
                  <Link href="/" className="flex items-center gap-2.5 font-semibold tracking-tight">
                    <span className="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-400 to-purple-500 flex items-center justify-center shadow-[0_0_20px_rgba(56,189,248,0.45)]">
                      <Sparkles className="w-4 h-4 text-white" />
                    </span>
                    <span className="text-lg bg-gradient-to-r from-white via-sky-100 to-purple-200 bg-clip-text text-transparent">{siteName}</span>
                  </Link>
                  <div className="hidden md:flex items-center gap-1">
                    {navLink("/", "Home")}
                    {customPages.map((p) => navLink(`/${p.slug}`, p.title))}
                    {user && navLink("/planner", "AI Planner", CalendarClock)}
                    {user && navLink("/dashboard", "Dashboard", LayoutDashboard)}
                    {user?.role === "ADMIN" && navLink("/admin", "Admin", ShieldCheck)}
                  </div>
                  <div className="hidden md:flex items-center gap-2">
                    {user ? (
                      <>
                        <span className="text-xs text-slate-300 px-2">{user.name}</span>
                        <button onClick={handleLogout} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs text-slate-200 cursor-pointer"><LogOut className="w-3.5 h-3.5" /> Sign Out</button>
                      </>
                    ) : (
                      <>
                        <Link href="/login" className="px-3.5 py-2 text-sm text-slate-300 hover:text-white">Sign In</Link>
                        <Link href="/register" className="glow-btn px-4 py-2 rounded-xl text-sm font-medium text-white">Get Started</Link>
                      </>
                    )}
                  </div>
                  <button onClick={() => setOpen(!open)} className="md:hidden p-2 text-slate-200">{open ? <X className="w-5 h-5" /> : <Menu className="w-5 h-5" />}</button>
                </nav>
                {open && (
                  <div className="md:hidden mt-2 max-w-7xl mx-auto liquid-glass rounded-2xl p-3 flex flex-col gap-1">
                    {navLink("/", "Home")}
                    {customPages.map((p) => navLink(`/${p.slug}`, p.title))}
                    {user ? (
                      <>
                        {navLink("/planner", "AI Planner", CalendarClock)}
                        {navLink("/dashboard", "Dashboard", LayoutDashboard)}
                        {user.role === "ADMIN" && navLink("/admin", "Admin", ShieldCheck)}
                        <button onClick={handleLogout} className="flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm text-rose-300 hover:bg-white/5 text-left"><LogOut className="w-4 h-4" /> Sign Out</button>
                      </>
                    ) : (
                      <div className="flex gap-2 pt-2">
                        <Link href="/login" onClick={() => setOpen(false)} className="flex-1 text-center py-2 rounded-xl bg-white/10 text-sm">Sign In</Link>
                        <Link href="/register" onClick={() => setOpen(false)} className="flex-1 text-center py-2 rounded-xl glow-btn text-sm font-medium">Get Started</Link>
                      </div>
                    )}
                  </div>
                )}
              </header>
            );
          }
          VESPERA_EOF

          cat <<'VESPERA_EOF' > src/components/landing/LandingClient.tsx
          "use client";
          import { useEffect, useRef } from "react";
          import Link from "next/link";
          import gsap from "gsap";
          import { ScrollTrigger } from "gsap/ScrollTrigger";
          import { ArrowRight, BrainCircuit, Clock3, Shield, Sparkles } from "lucide-react";
          import { LiquidOrbScene } from "@/components/three/LiquidOrbScene";
          import { GlassCard } from "@/components/ui/GlassCard";
          import { TypingText } from "@/components/ui/TypingText";

          gsap.registerPlugin(ScrollTrigger);

          interface Props {
            settings: { siteName: string; tagline: string; heroTitle: string; heroSubtitle: string; heroCtaText: string; footerText: string };
            sections: Array<{ id: string; badge: string | null; title: string; subtitle: string; content: string; imageUrl: string | null }>;
            projects: Array<{ id: string; title: string; category: string; description: string; imageUrl: string | null; linkUrl: string | null }>;
            isAuthenticated: boolean;
          }

          export function LandingClient({ settings, sections, projects, isAuthenticated }: Props) {
            const rootRef = useRef<HTMLDivElement>(null);

            useEffect(() => {
              const ctx = gsap.context(() => {
                gsap.from(".hero-stagger", { y: 28, opacity: 0, duration: 0.8, stagger: 0.12, ease: "power3.out" });
                gsap.from(".gsap-section-card", { scrollTrigger: { trigger: ".sections-grid", start: "top 85%" }, y: 28, opacity: 0, duration: 0.7, stagger: 0.14 });
              }, rootRef);
              return () => ctx.revert();
            }, []);

            return (
              <div ref={rootRef} className="max-w-7xl mx-auto px-4 sm:px-6 pb-20">
                <section className="min-h-[82vh] grid lg:grid-cols-12 gap-8 items-center py-10">
                  <div className="lg:col-span-7 space-y-6">
                    <div className="hero-stagger inline-flex items-center gap-2 px-4 py-1.5 rounded-full liquid-glass text-xs text-sky-300">
                      <Sparkles className="w-3.5 h-3.5" /><span>{settings.tagline}</span>
                    </div>
                    <h1 className="hero-stagger text-4xl sm:text-6xl font-bold tracking-tight leading-[1.08] bg-gradient-to-br from-white via-slate-100 to-sky-300 bg-clip-text text-transparent">{settings.heroTitle}</h1>
                    <p className="hero-stagger text-base sm:text-lg text-slate-300/90 max-w-2xl leading-relaxed">{settings.heroSubtitle}</p>
                    <div className="hero-stagger liquid-glass rounded-2xl p-4 max-w-xl border-sky-400/20">
                      <p className="text-[11px] uppercase tracking-widest text-slate-400 mb-1.5">Try Asking {settings.siteName}</p>
                      <p className="text-sm text-sky-200 font-mono">&ldquo;<TypingText phrases={["I have 3 hours of studying, gym, and two client calls.", "Plan my day with deep coding blocks and evening rest.", "Shift my workout to 18:30 and add a 20m break."]} />&rdquo;</p>
                    </div>
                    <div className="hero-stagger flex flex-wrap gap-4 pt-2">
                      <Link href={isAuthenticated ? "/planner" : "/register"} className="glow-btn px-6 py-3.5 rounded-2xl font-medium text-white inline-flex items-center gap-2">
                        <span>{settings.heroCtaText}</span><ArrowRight className="w-4 h-4" />
                      </Link>
                      <Link href={isAuthenticated ? "/dashboard" : "/login"} className="liquid-glass px-6 py-3.5 rounded-2xl font-medium text-slate-200 hover:bg-white/10 transition">
                        {isAuthenticated ? "Open Dashboard" : "Sign In"}
                      </Link>
                    </div>
                  </div>
                  <div className="lg:col-span-5 h-[380px] sm:h-[460px] relative">
                    <div className="absolute inset-0 bg-gradient-to-tr from-sky-500/20 via-transparent to-purple-500/20 blur-3xl rounded-full" />
                    <LiquidOrbScene />
                  </div>
                </section>

                <section className="py-16 space-y-8">
                  <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                    <div>
                      <p className="text-xs uppercase tracking-[0.2em] text-sky-400">Architecture</p>
                      <h2 className="text-3xl font-bold text-white mt-1">Intelligence Built for Human Rhythm</h2>
                    </div>
                    <div className="flex gap-4 text-xs text-slate-400">
                      <span className="flex items-center gap-1.5"><BrainCircuit className="w-4 h-4 text-sky-400" /> Real AI Core</span>
                      <span className="flex items-center gap-1.5"><Clock3 className="w-4 h-4 text-purple-400" /> Ultradian Breaks</span>
                      <span className="flex items-center gap-1.5"><Shield className="w-4 h-4 text-emerald-400" /> Private Data</span>
                    </div>
                  </div>
                  <div className="sections-grid grid md:grid-cols-3 gap-6">
                    {sections.map((sec) => (
                      <div key={sec.id} className="gsap-section-card liquid-glass liquid-glass-hover rounded-3xl p-6 flex flex-col gap-4">
                        {sec.imageUrl && <img src={sec.imageUrl} alt={sec.title} className="w-full h-40 object-cover rounded-2xl border border-white/10" />}
                        {sec.badge && <span className="self-start text-[10px] tracking-widest uppercase px-2.5 py-1 rounded-full bg-sky-400/15 text-sky-300 border border-sky-400/25">{sec.badge}</span>}
                        <div>
                          <h3 className="text-xl font-semibold text-white">{sec.title}</h3>
                          {sec.subtitle && <p className="text-sm text-sky-200/80 mt-1">{sec.subtitle}</p>}
                        </div>
                        <p className="text-sm text-slate-300/90 leading-relaxed">{sec.content}</p>
                      </div>
                    ))}
                  </div>
                </section>

                {projects.length > 0 && (
                  <section className="py-12 space-y-6">
                    <div>
                      <p className="text-xs uppercase tracking-[0.2em] text-purple-400">Ecosystem</p>
                      <h2 className="text-3xl font-bold text-white mt-1">Core Systems & Modules</h2>
                    </div>
                    <div className="grid md:grid-cols-3 gap-6">
                      {projects.map((p) => (
                        <GlassCard key={p.id} className="p-6 flex flex-col justify-between gap-4">
                          <div className="space-y-3">
                            {p.imageUrl && <img src={p.imageUrl} alt={p.title} className="w-full h-40 object-cover rounded-2xl border border-white/10" />}
                            <span className="text-xs text-purple-300 font-medium">{p.category}</span>
                            <h3 className="text-lg font-semibold text-white">{p.title}</h3>
                            <p className="text-sm text-slate-300 leading-relaxed">{p.description}</p>
                          </div>
                          {p.linkUrl && <a href={p.linkUrl} target="_blank" rel="noreferrer" className="text-xs text-sky-400 hover:underline">Explore Module →</a>}
                        </GlassCard>
                      ))}
                    </div>
                  </section>
                )}

                <footer className="mt-16 pt-8 border-t border-white/10 text-center text-xs text-slate-400">{settings.footerText}</footer>
              </div>
            );
